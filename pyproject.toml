[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "missing-aware-multimodal-sentiment"
version = "0.1.0"
description = "Q1 feature alignment and frozen E7a missing-aware sentiment research code"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.1,<3", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
include = ["src*", "e7a_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
